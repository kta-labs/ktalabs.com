<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA Labs — Acheter</title>
<link rel="icon" href="images/logo.png">
<style>
  :root {
    --black: #16204a;
    --navy-deep: #0e1730;
    --blue-accent: #4d6fb8;
    --grey-text: #6b7280;
    --border: #e8eaf1;
    --bg: #f8f9fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--black);
  }
  .top-accent {
    height: 4px;
    width: 100%;
    background: linear-gradient(90deg, var(--navy-deep), var(--blue-accent) 55%, #a9c1e8);
  }
  .top-bar {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top-bar img.mini-logo { height: 28px; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--grey-text);
    text-decoration: none;
    font-size: 13px;
  }
  .back-link:hover { color: var(--black); }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 24px 70px;
  }
  #loading, #notfound {
    text-align: center;
    color: var(--grey-text);
    padding: 60px 20px;
  }
  .breadcrumb {
    font-size: 12.5px;
    color: var(--grey-text);
    margin: 0 0 18px;
  }
  .breadcrumb a { color: var(--grey-text); text-decoration: none; }
  .breadcrumb a:hover { color: var(--black); }
  .product-layout {
    display: flex;
    gap: 32px;
    align-items: flex-start;
  }
  .product-image {
    flex: 0 0 340px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .product-image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .product-image .placeholder { font-size: 60px; }
  .product-image .badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: #eafaf0;
    color: #1a8a4a;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .product-image .badge.out { background: #fde8e8; color: #c0392b; }
  .product-image .badge.low { background: #fff4d9; color: #9a6b00; }
  .product-image .promo-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: #c0392b;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .product-info { flex: 1; min-width: 0; }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--blue-accent);
    margin: 0 0 8px;
  }
  h1.product-title {
    font-size: 24px;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  .reviews-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  .reviews-row .stars { color: #f0a500; letter-spacing: 2px; }
  .reviews-row a { color: var(--grey-text); text-decoration: none; }
  .reviews-row a:hover { color: var(--black); text-decoration: underline; }
  .price-row { margin-bottom: 16px; }
  .price-row .price {
    font-size: 26px;
    font-weight: 700;
  }
  .price-row .price.promo { color: #c0392b; }
  .price-row .price-old {
    font-size: 15px;
    font-weight: 400;
    color: var(--grey-text);
    text-decoration: line-through;
    margin-right: 8px;
  }
  .product-desc {
    font-size: 14.5px;
    line-height: 1.7;
    color: #333c5c;
    margin: 0 0 22px;
  }
  .product-desc strong { color: var(--black); }
  .buy-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .qty-stepper {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #f2f2f2;
    border-radius: 999px;
    padding: 8px 16px;
  }
  .qty-stepper button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: #fff;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .qty-stepper span {
    font-size: 15px;
    font-weight: 600;
    min-width: 18px;
    text-align: center;
  }
  .buy-btn {
    height: 48px;
    padding: 0 28px;
    border-radius: 999px;
    background: var(--black);
    color: #fff;
    border: none;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .buy-btn:hover { background: var(--navy-deep); }
  .buy-btn:disabled { opacity: .5; cursor: default; }
  .added-note {
    font-size: 13px;
    color: #1a8a4a;
    font-weight: 600;
    margin: 4px 0 14px;
    display: none;
  }
  .added-note.show { display: block; }
  .added-note a { color: var(--black); }
  .fiche-link {
    display: inline-block;
    font-size: 13px;
    color: var(--blue-accent);
    text-decoration: none;
    font-weight: 600;
    margin-top: 4px;
  }
  .fiche-link:hover { text-decoration: underline; }
  @media (max-width: 700px) {
    .product-layout { flex-direction: column; }
    .product-image { flex-basis: auto; width: 100%; }
  }
  .disclaimer {
    text-align: center;
    font-size: 11px;
    color: #a0a0a0;
    max-width: 640px;
    margin: 40px auto 0;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="top-accent"></div>

<div class="top-bar">
  <a class="back-link" href="catalogue.html">← Retour au catalogue</a>
  <img class="mini-logo" src="images/logo.png" alt="KTA Labs">
</div>

<main>
  <div id="loading">Chargement…</div>
  <div id="notfound" style="display:none">Produit introuvable.</div>
  <div id="content" style="display:none"></div>
</main>

<div class="disclaimer">Informations fournies à titre indicatif pour un usage de recherche uniquement. Non destiné à la consommation humaine ou animale.</div>

<script>
let PRODUCT = null;
let CART = JSON.parse(localStorage.getItem('kta_cart') || '{}');

function saveCart() {
  localStorage.setItem('kta_cart', JSON.stringify(CART));
  renderQty();
}

function fmtPrice(n) {
  return n.toFixed(2).replace('.', ',') + ' €';
}

function effectivePrix(p) {
  return (typeof p.prixPromo === 'number' && p.prixPromo < p.prix) ? p.prixPromo : p.prix;
}

function normalize(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
}

function matchesProduct(avisProduit, p) {
  if (!avisProduit) return false;
  const a = normalize(avisProduit);
  const candidates = [p.nom, p.tallyLabel].filter(Boolean).map(normalize);
  return candidates.some(c => a.includes(c) || c.includes(a));
}

function stars(note) {
  const rounded = Math.round(note);
  return '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
}

function buildDescription(p, fiche) {
  const parts = [];
  if (fiche && fiche.a_savoir) {
    parts.push(fiche.a_savoir);
  } else if (p.description) {
    parts.push(`${p.nom} — ${p.description}.`);
  }
  if (fiche && fiche.effets && fiche.effets.length) {
    parts.push(`Recherché notamment pour : ${fiche.effets.slice(0, 3).join(', ').toLowerCase()}.`);
  }
  parts.push('Pureté supérieure à 99 %, lot certifié Janoshik. Expédition sous 24 à 48h.');
  return parts.join(' ');
}

function renderQty() {
  const qty = CART[PRODUCT.sku] || 0;
  const zone = document.getElementById('buyZone');
  if (!zone) return;
  if (qty === 0) {
    zone.innerHTML = `<button class="buy-btn" id="addBtn">Ajouter au panier</button>`;
    document.getElementById('addBtn').onclick = () => { addToCart(1); };
  } else {
    zone.innerHTML = `
      <div class="qty-stepper">
        <button onclick="addToCart(-1)">−</button>
        <span>${qty}</span>
        <button onclick="addToCart(1)">+</button>
      </div>
    `;
  }
  const note = document.getElementById('addedNote');
  if (note) note.classList.toggle('show', qty > 0);
}

function addToCart(delta) {
  const sku = PRODUCT.sku;
  const current = CART[sku] || 0;
  const next = Math.max(0, current + delta);
  if (next === 0) delete CART[sku]; else CART[sku] = next;
  saveCart();
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const sku = params.get('sku');

  const [productsRes, fichesRes, avisRes] = await Promise.all([
    fetch('products.json'),
    fetch('fiches.json').catch(() => null),
    fetch('avis.json').catch(() => null)
  ]);
  const products = await productsRes.json();
  const fiches = fichesRes ? await fichesRes.json().catch(() => ({})) : {};
  const avisList = avisRes ? await avisRes.json().catch(() => []) : [];

  const p = products.find(pr => pr.sku === sku);
  document.getElementById('loading').style.display = 'none';

  if (!p) {
    document.getElementById('notfound').style.display = 'block';
    return;
  }
  PRODUCT = p;
  const fiche = p.ficheId ? fiches[p.ficheId] : null;

  const inStock = p.stock !== null ? p.stock > 0 : (p.disponibilite !== 'Rupture de stock');
  const stockLabel = p.stock !== null ? `${p.stock} en stock` : (p.disponibilite || 'En stock');
  let badgeClass = '';
  if (!inStock) badgeClass = 'out';
  else if (p.stock !== null) {
    if (p.stock < 5) badgeClass = 'out';
    else if (p.stock < 10) badgeClass = 'low';
  }

  const hasPromo = typeof p.prixPromo === 'number' && p.prixPromo < p.prix;
  const priceHtml = hasPromo
    ? `<span class="price-old">${p.prix.toFixed(2).replace('.', ',')} €</span><span class="price promo">${p.prixPromo.toFixed(2).replace('.', ',')} €</span>`
    : `<span class="price">${p.prix.toFixed(2).replace('.', ',')} €</span>`;

  const matched = avisList.filter(a => matchesProduct(a.produit, p));
  const reviewCount = matched.length;
  const reviewAvg = reviewCount ? matched.reduce((s, a) => s + (a.note || 0), 0) / reviewCount : 0;
  const reviewsHtml = reviewCount > 0
    ? `<span class="stars">${stars(reviewAvg)}</span><a href="avis.html">(${reviewCount} avis client${reviewCount > 1 ? 's' : ''})</a>`
    : `<a href="avis.html">Sois le premier à laisser un avis</a>`;

  const desc = buildDescription(p, fiche);

  document.title = `Acheter ${p.nom} — KTA Labs`;

  const html = `
    <div class="breadcrumb">
      <a href="index.html">Accueil</a> / <a href="catalogue.html">${p.categorie}</a> / Acheter ${p.nom}
    </div>
    <div class="product-layout">
      <div class="product-image">
        <span class="badge ${badgeClass}">${inStock ? stockLabel : 'Rupture'}</span>
        ${hasPromo ? `<span class="promo-badge">PROMOTION</span>` : ''}
        ${p.image ? `<img src="${p.image}" alt="${p.nom}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'placeholder',textContent:'💉'}))">` : `<span class="placeholder">💉</span>`}
      </div>
      <div class="product-info">
        <p class="eyebrow">${p.categorie}</p>
        <h1 class="product-title">Acheter ${p.nom}${p.description ? ` | ${p.description}` : ''}</h1>
        <div class="reviews-row">${reviewsHtml}</div>
        <div class="price-row">${priceHtml}</div>
        <p class="product-desc">${desc}</p>
        <div class="buy-row">
          <div id="buyZone"></div>
        </div>
        <div class="added-note" id="addedNote">✓ Ajouté au panier — <a href="catalogue.html">voir mon panier</a></div>
        ${p.ficheId ? `<a class="fiche-link" href="produit.html?id=${p.ficheId}&img=${encodeURIComponent(p.image)}">Voir la fiche technique (dosage, reconstitution, effets) →</a>` : ''}
      </div>
    </div>
  `;

  const contentEl = document.getElementById('content');
  contentEl.innerHTML = html;
  contentEl.style.display = 'block';
  renderQty();
}

load();
</script>

</body>
</html>
