<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA Labs — Acheter</title>
<link rel="icon" href="images/logo.png">
<meta name="description" content="Achète tes peptides de recherche KTA Labs : pureté certifiée Janoshik, kits de reconstitution disponibles, expédition sous 24 à 48h.">
<meta property="og:type" content="product">
<meta property="og:image" content="https://kta-labs.github.io/ktalabs.com/images/logo.png">
<style>
  :root {
    --black: #16204a;
    --navy-deep: #0e1730;
    --blue-accent: #4d6fb8;
    --grey-text: #6b7280;
    --border: #e8eaf1;
    --bg: #f8f9fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--black);
  }
  .top-accent {
    height: 4px;
    width: 100%;
    background: linear-gradient(90deg, var(--navy-deep), var(--blue-accent) 55%, #a9c1e8);
  }
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    max-width: 980px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top-bar img.mini-logo { height: 28px; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--grey-text);
    text-decoration: none;
    font-size: 13px;
  }
  .back-link:hover { color: var(--black); }
  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .cart-icon-btn {
    position: relative;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    text-decoration: none;
    color: var(--black);
  }
  .cart-icon-btn .cart-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #e63946;
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    min-width: 17px;
    height: 17px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }
  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 24px 70px;
  }
  #loading, #notfound {
    text-align: center;
    color: var(--grey-text);
    padding: 60px 20px;
  }
  .breadcrumb {
    font-size: 12.5px;
    color: var(--grey-text);
    margin: 0 0 18px;
  }
  .breadcrumb a { color: var(--grey-text); text-decoration: none; }
  .breadcrumb a:hover { color: var(--black); }
  .product-layout {
    display: flex;
    gap: 32px;
    align-items: flex-start;
  }
  .product-image {
    flex: 0 0 340px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .product-image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .product-image .placeholder { font-size: 60px; }
  .product-image .badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: #eafaf0;
    color: #1a8a4a;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .product-image .badge.out { background: #fde8e8; color: #c0392b; }
  .product-image .badge.low { background: #fff4d9; color: #9a6b00; }
  .product-image .promo-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: #c0392b;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .product-info { flex: 1; min-width: 0; }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--blue-accent);
    margin: 0 0 8px;
  }
  h1.product-title {
    font-size: 24px;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  .reviews-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  .reviews-row .stars { color: #f0a500; letter-spacing: 2px; }

  .reviews-row a:hover { color: var(--black); text-decoration: underline; }
  .price-row { margin-bottom: 16px; }
  .price-row .price {
    font-size: 26px;
    font-weight: 700;
  }
  .price-row .price.promo { color: #c0392b; }
  .price-row .price-old {
    font-size: 15px;

    color: var(--grey-text);
    text-decoration: line-through;
    margin-right: 8px;
  }
  .product-desc {
    font-size: 14.5px;
    line-height: 1.7;
    color: #333c5c;
    margin: 0 0 22px;
  }
  .product-desc strong { color: var(--black); }
  .swabs-note,
  .lot-note {
    display: flex;
    align-items: flex-start;

    font-size: 12.5px;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;

  .swabs-note .note-icon,

  .swabs-note {

  }
  .lot-note {

  ul.pack-contenu {
    font-size: 14px;

  ul.pack-contenu li.duree {
    color: var(--black);
    font-weight: 600;
    list-style: none;
    margin-left: -20px;
    margin-top: 6px;
  }
  .qty-stepper {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #f2f2f2;
    border-radius: 999px;
    padding: 8px 16px;
  }
  .qty-stepper button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: #fff;
    cursor: pointer;
    font-size: 16px;

  .qty-stepper span {

    font-weight: 600;

  .buy-btn {
    height: 48px;
    padding: 0 28px;
    border-radius: 999px;
    background: var(--black);
    color: #fff;
    border: none;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .buy-btn:hover { background: var(--navy-deep); }
  .buy-btn:disabled { opacity: .5; cursor: default; }
  .qty-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .added-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: #1a8a4a;
    background: #eafaf0;
    border-radius: 999px;
    padding: 8px 16px;
    text-decoration: none;
    white-space: nowrap;
  }
  .added-pill:hover { background: #dcf5e6; }
  .action-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  #buyZone { display: flex; }
  .action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    padding: 13px 20px;
    border-radius: 999px;
    white-space: nowrap;
    box-sizing: border-box;
  }
  .action-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .action-btn.outline {
    background: #fff;
    border: 1.5px solid var(--black);
    color: var(--black);
  }
  .action-btn.outline:hover { background: var(--black); color: #fff; }
  .action-btn.filled {
    background: var(--blue-accent);
    border: 1.5px solid var(--blue-accent);
    color: #fff;
  }
  .action-btn.filled:hover { background: var(--black); border-color: var(--black); }
  .action-btn.purity-btn { cursor: pointer; font-family: inherit; }
  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,15,30,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 400;
    padding: 24px;
  }
  .lightbox-overlay.visible { display: flex; }
  .lightbox-content {
    position: relative;
    max-width: 100%;
    max-height: 100%;
  }
  .lightbox-content img {
    max-width: 100%;
    max-height: 85vh;
    display: block;
    border-radius: 8px;
  }
  .lightbox-close {
    position: absolute;
    top: -44px;
    right: 0;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.3); }
  .lightbox-back {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .lightbox-back:hover { background: rgba(255,255,255,0.3); }
  @media (max-width: 640px) {
    .action-btn {
      flex: 1 1 130px;
      min-width: 0;
      padding: 10px 6px;
      font-size: 11.5px;
      white-space: normal;
      text-align: center;
      line-height: 1.25;
    }
    .action-btn svg { width: 14px; height: 14px; }
    #buyZone {
      flex: 1 1 100%;
      justify-content: center;
    }
    #buyZone .buy-btn {
      width: 100%;
    }
  }
  .action-row.has-purity #buyZone {
    order: -1;
    flex: 1 1 100%;
    justify-content: center;
  }
  .action-row.has-purity #buyZone .buy-btn {
    width: 100%;
  }
  @media (min-width: 641px) {
    .action-row.has-purity .action-btn {
      flex: 1 1 0;
      min-width: 0;
    }
  }
  @media (max-width: 700px) {
    .product-layout { flex-direction: column; }
    .product-image { flex-basis: auto; width: 100%; }
  }
  .suggestions { margin-top: 44px; }
  .suggestions-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--grey-text);
    margin: 0 0 16px;
  }
  .suggestions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .sugg-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    text-decoration: none;
    color: var(--black);
    display: flex;
    flex-direction: column;
    transition: box-shadow .15s, transform .15s;
  }
  .sugg-card:hover {
    box-shadow: 0 8px 20px rgba(22,32,74,0.10);
    transform: translateY(-2px);
  }
  .sugg-image {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }
  .sugg-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .sugg-image .placeholder { font-size: 32px; }
  .sugg-name { font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
  .sugg-price { font-size: 14.5px; font-weight: 700; }
  .sugg-price.promo { color: #c0392b; }
  .sugg-price-old {
    font-size: 12px;
    font-weight: 400;
    color: var(--grey-text);
    text-decoration: line-through;
    margin-right: 6px;
  }
  .disclaimer {
    text-align: center;
    font-size: 11px;
    color: #a0a0a0;
    max-width: 640px;
    margin: 40px auto 0;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="top-accent"></div>

<div class="top-bar">
  <a class="back-link" href="catalogue.html">← Retour au catalogue</a>
  <div class="top-bar-right">
    <a class="cart-icon-btn" id="cartIconBtn" href="catalogue.html?panier=1" aria-label="Voir mon panier">
      🛒
      <span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </a>
    <img class="mini-logo" src="images/logo.png" alt="KTA Labs">
  </div>
</div>

<main>
  <div id="loading">Chargement…</div>
  <div id="notfound" style="display:none">Produit introuvable.</div>
  <div id="content" style="display:none"></div>
</main>

<div class="disclaimer">Informations fournies à titre indicatif pour un usage de recherche uniquement. Non destiné à la consommation humaine ou animale.</div>
<div style="text-align:center;margin:10px 0 20px;font-size:12px">
  <a href="mentions-legales.html" style="color:var(--grey-text);text-decoration:none;margin:0 8px">Mentions légales</a>·
  <a href="cgv.html" style="color:var(--grey-text);text-decoration:none;margin:0 8px">CGV</a>·
  <a href="confidentialite.html" style="color:var(--grey-text);text-decoration:none;margin:0 8px">Confidentialité</a>
</div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <button type="button" class="lightbox-back" id="lightboxBackBtn">← Retour</button>
  <div class="lightbox-content">
    <button type="button" class="lightbox-close" id="lightboxCloseBtn">✕</button>
    <img src="" alt="" id="lightboxImg">
  </div>
</div>

<script>
let PRODUCT = null;
let PRODUCTS = [];
let CART = JSON.parse(localStorage.getItem('kta_cart') || '{}');

function updateCartBadge() {
  const badge = document.getElementById('cartBadge');
  if (!badge) return;
  const total = Object.values(CART).reduce((a, b) => a + b, 0);
  badge.textContent = total;
  badge.style.display = total > 0 ? 'flex' : 'none';
}
updateCartBadge();

function saveCart() {
  localStorage.setItem('kta_cart', JSON.stringify(CART));
  renderQty();
  updateCartBadge();
}

function fmtPrice(n) {
  return n.toFixed(2).replace('.', ',') + ' €';
}

function effectivePrix(p) {
  return (typeof p.prixPromo === 'number' && p.prixPromo < p.prix) ? p.prixPromo : p.prix;
}

function normalize(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '').replace(/\s+/g, ' ').trim();
}

function matchesProduct(avisProduit, p) {
  if (!avisProduit) return false;
  const a = normalize(avisProduit);
  const candidates = [p.nom, p.tallyLabel].filter(Boolean).map(normalize);
  return candidates.some(c => a.includes(c) || c.includes(a));
}

function stars(note) {
  const rounded = Math.round(note);
  return '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
}

function getEffectiveStock(p) {
  if (p.categorie === 'Kits' && p.composants && p.composants.length) {
    const peptide = PRODUCTS.find(pr => pr.categorie === 'Peptides' && pr.tallyLabel === p.composants[0].tallyLabel);
    if (peptide) return peptide.stock;
  }
  return p.stock;
}

const QUALITY_LINE = 'Pureté supérieure à 99&nbsp;%, lot certifié Janoshik. Expédition sous 24 à 48h.';

function buildPeptideDescription(p, fiche) {
  const parts = [];
  if (fiche && fiche.effets && fiche.effets.length) {
    parts.push(`Recherché notamment pour : ${fiche.effets.slice(0, 3).join(', ').toLowerCase()}.`);
  }
  if (fiche && fiche.a_savoir) {
    parts.push(fiche.a_savoir);
  } else if (p.description) {
    parts.push(`${p.nom} — ${p.description}.`);
  }
  parts.push(QUALITY_LINE);
  return parts.join(' ');
}

function buildPackDescription(p, fiches) {
  const parts = [];
  const effetsSet = [];
  (p.composants || []).forEach(c => {
    const prod = PRODUCTS.find(pr => pr.tallyLabel === c.tallyLabel);
    const fiche = prod && prod.ficheId ? fiches[prod.ficheId] : null;
    if (fiche && fiche.effets) {
      fiche.effets.forEach(e => { if (!effetsSet.includes(e)) effetsSet.push(e); });
    }
  });
  if ((p.composants || []).length) {
    const noms = p.composants.map(c => c.tallyLabel).join(' + ');
    parts.push(`Ce pack associe ${noms}.`);
  }
  if (effetsSet.length) {
    parts.push(`Recherché notamment pour : ${effetsSet.slice(0, 5).join(', ').toLowerCase()}.`);
  }
  parts.push(QUALITY_LINE);
  return parts.join(' ');
}

function buildBacWaterDescription(p) {
  const parts = [];
  parts.push(`Eau bactériostatique utilisée pour la reconstitution (dilution) d'un peptide lyophilisé avant injection.${p.description ? ' ' + p.description + '.' : ''}`);
  parts.push("Se prélève à la seringue et s'injecte directement dans la fiole de peptide avant utilisation.");
  return parts.join(' ');
}

function buildSeringuesDescription() {
  return "Seringues à insuline 1 ml, aiguille 30G x 8mm, à usage unique — utilisées pour la reconstitution (prélèvement du diluant) et l'injection du peptide.";
}

function buildDefaultDescription(p) {
  return p.description ? `${p.nom} — ${p.description}.` : p.nom;
}

function swabsNoteHtml(p) {
  if (p.categorie === 'Packs' || p.categorie === 'Kits' || p.sku === 'seringues') {
    return `<div class="swabs-note"><span class="note-icon">🎁</span><span>Tampons désinfectants offerts avec les packs, les kits et les seringues.</span></div>`;
  }
  return '';
}

function lotNoteHtml(p) {
  if (p.tallyVolumeField || p.sku === 'seringues') return '';
  return `<div class="lot-note"><span class="note-icon">ℹ️</span><span>La couleur du bouchon de la fiole peut changer selon les numéros de lot.</span></div>`;
}

function buildKitDescription(p, fiche) {
  const parts = [];
  if (fiche && fiche.effets && fiche.effets.length) {
    parts.push(`Recherché notamment pour : ${fiche.effets.slice(0, 3).join(', ').toLowerCase()}.`);
  }
  if (fiche && fiche.a_savoir) {
    parts.push(fiche.a_savoir);
  }
  parts.push("Ce kit contient tout le nécessaire pour démarrer : le peptide, une Bac Water 3ml pour la reconstitution, et les seringues pour l'injection.");
  parts.push(QUALITY_LINE);
  return parts.join(' ');
}

function buildDescription(p, fiche, fiches) {
  if (p.categorie === 'Kits') return buildKitDescription(p, fiche);
  if (p.ficheId) return buildPeptideDescription(p, fiche);
  if (p.categorie === 'Packs') return buildPackDescription(p, fiches);
  if (p.tallyVolumeField) return buildBacWaterDescription(p);
  if (p.sku === 'seringues') return buildSeringuesDescription();
  return buildDefaultDescription(p);
}

const FICHE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line></svg>';
const CALC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="11" x2="8" y2="11"></line><line x1="12" y1="11" x2="12" y2="11"></line><line x1="16" y1="11" x2="16" y2="11"></line><line x1="8" y1="15" x2="8" y2="15"></line><line x1="12" y1="15" x2="12" y2="15"></line><line x1="16" y1="15" x2="16" y2="15"></line><line x1="8" y1="19" x2="8" y2="19"></line><line x1="12" y1="19" x2="12" y2="19"></line><line x1="16" y1="19" x2="16" y2="19"></line></svg>';
const TEST_ICON = '🧪';

function purityTestsFor(p) {
  const haystack = [p.nom, p.tallyLabel, ...(p.composants || []).map(c => c.tallyLabel)]
    .filter(Boolean).join(' ').toLowerCase();
  const tests = [];
  if (haystack.includes('retatrutide')) tests.push({ label: 'Retatrutide', img: 'images/test-purete-retatrutide.png' });
  if (haystack.includes('ghk')) tests.push({ label: 'GHK-Cu', img: 'images/test-purete-ghkcu.png' });
  return tests;
}

function purityLinksHtml(p) {
  const tests = purityTestsFor(p);
  return tests.map(t => `<button type="button" class="action-btn outline purity-btn" data-img="${t.img}" data-alt="Test de pureté ${t.label}">${TEST_ICON} Test de pureté${tests.length > 1 ? ' ' + t.label : ''}</button>`).join('');
}

function fichesLinksHtml(p, fiches) {
  if (p.ficheId) {
    return `<a class="action-btn outline" href="produit.html?id=${p.ficheId}&img=${encodeURIComponent(p.image)}">${FICHE_ICON}Fiche technique</a>`;
  }
  if (p.categorie === 'Packs' && (p.composants || []).length) {
    return p.composants.map(c => {
      const prod = PRODUCTS.find(pr => pr.tallyLabel === c.tallyLabel);
      if (!prod || !prod.ficheId) return '';
      return `<a class="action-btn outline" href="produit.html?id=${prod.ficheId}&img=${encodeURIComponent(prod.image)}">${FICHE_ICON}Fiche ${c.tallyLabel}</a>`;
    }).filter(Boolean).join('');
  }
  return '';
}

function packContenuHtml(p) {
  if (!p.contenu || !p.contenu.length) return '';
  return `<ul class="pack-contenu">${p.contenu.map(item => {
    const isDuree = item.startsWith('Durée');
    return `<li${isDuree ? ' class="duree"' : ''}>${item}</li>`;
  }).join('')}</ul>`;
}

function renderQty() {
  const stock = getEffectiveStock(PRODUCT);
  const inStock = stock !== null ? stock > 0 : (PRODUCT.disponibilite !== 'Rupture de stock');
  const qty = CART[PRODUCT.sku] || 0;
  const zone = document.getElementById('buyZone');
  if (!zone) return;
  if (!inStock) {
    zone.innerHTML = `<button class="buy-btn" disabled>Rupture de stock</button>`;
  } else if (qty === 0) {
    zone.innerHTML = `<button class="buy-btn" id="addBtn">Ajouter au panier</button>`;
    document.getElementById('addBtn').onclick = () => { addToCart(1); };
  } else {
    zone.innerHTML = `
      <div class="qty-row">
        <div class="qty-stepper">
          <button onclick="addToCart(-1)">−</button>
          <span>${qty}</span>
          <button onclick="addToCart(1)">+</button>
        </div>
        <a class="added-pill" href="catalogue.html?panier=1">✓ Voir mon panier</a>
      </div>
    `;
  }
}

function addToCart(delta) {
  const sku = PRODUCT.sku;
  const stock = getEffectiveStock(PRODUCT);

  if (delta > 0 && typeof stock === 'number' && (CART[sku] || 0) + delta > stock) {
    alert(`Il ne reste que ${stock} en stock.`);
    return;
  }

  if (PRODUCT.tallyVolumeField && delta > 0) {
    const otherBacWaterSku = PRODUCTS.find(pr => pr.tallyVolumeField === PRODUCT.tallyVolumeField && pr.sku !== sku)?.sku;
    if (otherBacWaterSku && CART[otherBacWaterSku]) {
      alert("Tu ne peux choisir qu'un seul volume de Bac Water par commande. L'ancien volume a été retiré du panier.");
      delete CART[otherBacWaterSku];
    }
  }

  const current = CART[sku] || 0;
  const next = Math.max(0, current + delta);
  if (next === 0) delete CART[sku]; else CART[sku] = next;
  saveCart();
}

function buildSuggestions(p, products) {
  const others = products.filter(pr => pr.sku !== p.sku);
  let picks = [];
  if (p.categorie === 'Kits') {
    const rawPeptide = others.find(pr => pr.categorie === 'Peptides' && pr.ficheId === p.ficheId);
    const otherKit = others.find(pr => pr.categorie === 'Kits');
    const pack = others.find(pr => pr.categorie === 'Packs');
    picks = [rawPeptide, otherKit, pack];
  } else if (p.categorie === 'Peptides') {
    const kit = others.find(pr => pr.categorie === 'Kits' && pr.ficheId === p.ficheId);
    const bacwater = others.find(pr => pr.tallyVolumeField);
    const seringues = others.find(pr => pr.sku === 'seringues');
    picks = kit ? [kit, bacwater, seringues] : [bacwater, seringues, others.find(pr => pr.categorie === 'Peptides' && pr.ficheId !== p.ficheId)];
  } else if (p.categorie === 'Packs') {
    const otherPack = others.find(pr => pr.categorie === 'Packs');
    const bacwater = others.find(pr => pr.tallyVolumeField);
    const seringues = others.find(pr => pr.sku === 'seringues');
    picks = [otherPack, bacwater, seringues];
  } else if (p.tallyVolumeField) {
    const seringues = others.find(pr => pr.sku === 'seringues');
    const peptides = others.filter(pr => pr.categorie === 'Peptides');
    picks = [seringues, peptides[0], peptides[1]];
  } else if (p.sku === 'seringues') {
    const bacwater = others.find(pr => pr.tallyVolumeField);
    const peptides = others.filter(pr => pr.categorie === 'Peptides');
    picks = [bacwater, peptides[0], peptides[1]];
  }
  return picks.filter(Boolean).slice(0, 3);
}

function suggestionsHtml(p, products) {
  const picks = buildSuggestions(p, products);
  if (picks.length === 0) return '';
  const cards = picks.map(sp => {
    const hasPromo = typeof sp.prixPromo === 'number' && sp.prixPromo < sp.prix;
    const hasBarre = !hasPromo && typeof sp.prixBarre === 'number' && sp.prixBarre > sp.prix;
    let priceHtml;
    if (hasPromo) {
      priceHtml = `<span class="sugg-price-old">${sp.prix.toFixed(2).replace('.', ',')} €</span><span class="sugg-price promo">${sp.prixPromo.toFixed(2).replace('.', ',')} €</span>`;
    } else if (hasBarre) {
      priceHtml = `<span class="sugg-price-old">${sp.prixBarre.toFixed(2).replace('.', ',')} €</span><span class="sugg-price">${sp.prix.toFixed(2).replace('.', ',')} €</span>`;
    } else {
      priceHtml = `<span class="sugg-price">${sp.prix.toFixed(2).replace('.', ',')} €</span>`;
    }
    return `
      <a class="sugg-card" href="acheter.html?sku=${encodeURIComponent(sp.sku)}">
        <div class="sugg-image">
          ${sp.image ? `<img src="${sp.image}" alt="${sp.nom}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'placeholder',textContent:'💉'}))">` : `<span class="placeholder">💉</span>`}
        </div>
        <div class="sugg-name">${sp.nom}</div>
        <div class="sugg-price-row">${priceHtml}</div>
      </a>
    `;
  }).join('');
  return `
    <section class="suggestions">
      <h2 class="suggestions-title">Tu pourrais aussi aimer</h2>
      <div class="suggestions-grid">${cards}</div>
    </section>
  `;
}

const SITE_BASE_URL = 'https://kta-labs.github.io/ktalabs.com/';

function setMetaTag(attr, key, content) {
  let el = document.querySelector(`meta[${attr}="${key}"]`);
  if (!el) {
    el = document.createElement('meta');
    el.setAttribute(attr, key);
    document.head.appendChild(el);
  }
  el.setAttribute('content', content);
}

function setCanonical(href) {
  let el = document.querySelector('link[rel="canonical"]');
  if (!el) {
    el = document.createElement('link');
    el.setAttribute('rel', 'canonical');
    document.head.appendChild(el);
  }
  el.setAttribute('href', href);
}

function setJsonLd(data) {
  let el = document.getElementById('productSchema');
  if (!el) {
    el = document.createElement('script');
    el.type = 'application/ld+json';
    el.id = 'productSchema';
    document.head.appendChild(el);
  }
  el.textContent = JSON.stringify(data);
}

function updateSeoTags(p, descHtml, ctx) {
  const pageUrl = `${SITE_BASE_URL}acheter.html?sku=${encodeURIComponent(p.sku)}`;
  const imageUrl = p.image ? `${SITE_BASE_URL}${p.image}` : `${SITE_BASE_URL}images/logo.png`;
  const plainDesc = descHtml.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 300);
  const title = `${p.nom} — KTA Labs`;

  setMetaTag('name', 'description', plainDesc);
  setCanonical(pageUrl);
  setMetaTag('property', 'og:type', 'product');
  setMetaTag('property', 'og:url', pageUrl);
  setMetaTag('property', 'og:title', title);
  setMetaTag('property', 'og:description', plainDesc);
  setMetaTag('property', 'og:image', imageUrl);
  setMetaTag('name', 'twitter:card', 'summary_large_image');
  setMetaTag('name', 'twitter:title', title);
  setMetaTag('name', 'twitter:description', plainDesc);
  setMetaTag('name', 'twitter:image', imageUrl);

  const effectivePrice = ctx.hasPromo ? p.prixPromo : p.prix;
  const schema = {
    '@context': 'https://schema.org/',
    '@type': 'Product',
    name: p.nom,
    image: [imageUrl],
    description: plainDesc,
    sku: p.sku,
    brand: { '@type': 'Brand', name: 'KTA Labs' },
    offers: {
      '@type': 'Offer',
      url: pageUrl,
      priceCurrency: 'EUR',
      price: effectivePrice.toFixed(2),
      availability: ctx.inStock ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
      itemCondition: 'https://schema.org/NewCondition'
    }
  };
  if (ctx.reviewCount > 0) {
    schema.aggregateRating = {
      '@type': 'AggregateRating',
      ratingValue: ctx.reviewAvg.toFixed(1),
      reviewCount: ctx.reviewCount
    };
  }
  setJsonLd(schema);
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const sku = params.get('sku');

  const [productsRes, fichesRes, avisRes] = await Promise.all([
    fetch('products.json'),
    fetch('fiches.json').catch(() => null),
    fetch('avis.json').catch(() => null)
  ]);
  const products = await productsRes.json();
  const fiches = fichesRes ? await fichesRes.json().catch(() => ({})) : {};
  const avisList = avisRes ? await avisRes.json().catch(() => []) : [];

  PRODUCTS = products;
  const p = products.find(pr => pr.sku === sku);
  document.getElementById('loading').style.display = 'none';

  if (!p) {
    document.getElementById('notfound').style.display = 'block';
    return;
  }
  PRODUCT = p;
  const fiche = p.ficheId ? fiches[p.ficheId] : null;

  const stock = getEffectiveStock(p);
  const inStock = stock !== null ? stock > 0 : (p.disponibilite !== 'Rupture de stock');
  const stockLabel = stock !== null ? `${stock} en stock` : (p.disponibilite || 'En stock');
  let badgeClass = '';
  if (!inStock) badgeClass = 'out';
  else if (stock !== null) {
    if (stock < 5) badgeClass = 'out';
    else if (stock < 10) badgeClass = 'low';
  }

  const hasPromo = typeof p.prixPromo === 'number' && p.prixPromo < p.prix;
  const hasBarre = !hasPromo && typeof p.prixBarre === 'number' && p.prixBarre > p.prix;
  let priceHtml;
  if (hasPromo) {
    priceHtml = `<span class="price-old">${p.prix.toFixed(2).replace('.', ',')} €</span><span class="price promo">${p.prixPromo.toFixed(2).replace('.', ',')} €</span>`;
  } else if (hasBarre) {
    priceHtml = `<span class="price-old">${p.prixBarre.toFixed(2).replace('.', ',')} €</span><span class="price">${p.prix.toFixed(2).replace('.', ',')} €</span>`;
  } else {
    priceHtml = `<span class="price">${p.prix.toFixed(2).replace('.', ',')} €</span>`;
  }

  const matched = avisList.filter(a => matchesProduct(a.produit, p));
  const reviewCount = matched.length;
  const reviewAvg = reviewCount ? matched.reduce((s, a) => s + (a.note || 0), 0) / reviewCount : 0;
  const reviewsHtml = reviewCount > 0
    ? `<span class="stars">${stars(reviewAvg)}</span><a href="avis.html">(${reviewCount} avis client${reviewCount > 1 ? 's' : ''})</a>`
    : `<a href="avis.html">Sois le premier à laisser un avis</a>`;

  const desc = buildDescription(p, fiche, fiches);
  const subtitle = p.ficheId && p.description ? ` | ${p.description}` : '';

  document.title = `${p.nom} — KTA Labs`;
  updateSeoTags(p, desc, { hasPromo, inStock, reviewCount, reviewAvg });

  const hasPurity = purityTestsFor(p).length > 0;
  const actionButtonsHtml = fichesLinksHtml(p, fiches) + purityLinksHtml(p);

  const html = `
    <div class="breadcrumb">
      <a href="index.html">Accueil</a> / <a href="catalogue.html">${p.categorie}</a> / ${p.nom}
    </div>
    <div class="product-layout">
      <div class="product-image">
        <span class="badge ${badgeClass}">${inStock ? stockLabel : 'Rupture'}</span>
        ${hasPromo ? `<span class="promo-badge">PROMOTION</span>` : ''}
        ${p.image ? `<img src="${p.image}" alt="${p.nom}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'placeholder',textContent:'💉'}))">` : `<span class="placeholder">💉</span>`}
      </div>
      <div class="product-info">
        <p class="eyebrow">${p.categorie}</p>
        <h1 class="product-title">${p.nom}${subtitle}</h1>
        <div class="reviews-row">${reviewsHtml}</div>
        <div class="price-row">${priceHtml}</div>
        ${packContenuHtml(p)}
        <p class="product-desc">${desc}</p>
        ${lotNoteHtml(p)}
        ${swabsNoteHtml(p)}
        <div class="action-row${hasPurity ? ' has-purity' : ''}">
          <div id="buyZone"></div>
          ${actionButtonsHtml}
        </div>
      </div>
    </div>
    ${suggestionsHtml(p, products)}
  `;

  const contentEl = document.getElementById('content');
  contentEl.innerHTML = html;
  contentEl.style.display = 'block';
  renderQty();
}

let SAVED_SCROLL_Y = 0;
function lockBodyScroll() {
  SAVED_SCROLL_Y = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${SAVED_SCROLL_Y}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}
function unlockBodyScroll() {
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, SAVED_SCROLL_Y);
}
const lightboxOverlay = document.getElementById('lightboxOverlay');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src, alt) {
  lightboxImg.src = src;
  lightboxImg.alt = alt;
  lightboxOverlay.classList.add('visible');
  lockBodyScroll();
}
function closeLightbox() {
  lightboxOverlay.classList.remove('visible');
  unlockBodyScroll();
}
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.purity-btn');
  if (!btn) return;
  e.preventDefault();
  openLightbox(btn.dataset.img, btn.dataset.alt);
});
document.getElementById('lightboxCloseBtn').addEventListener('click', closeLightbox);
document.getElementById('lightboxBackBtn').addEventListener('click', closeLightbox);
lightboxOverlay.addEventListener('click', (e) => {
  if (e.target.id === 'lightboxOverlay') closeLightbox();
});

load();
</script>
