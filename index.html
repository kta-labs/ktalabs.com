<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA Labs — Catalogue</title>
<style>
  :root {
    --black: #111111;
    --grey-text: #6b6b6b;
    --border: #ececec;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--black);
  }
  header {
    text-align: center;
    padding: 48px 20px 24px;
  }
  header h1 {
    font-size: 28px;
    letter-spacing: 2px;
    margin: 0 0 6px;
    font-weight: 700;
  }
  header p {
    color: var(--grey-text);
    font-size: 14px;
    margin: 0;
  }
  .disclaimer {
    text-align: center;
    font-size: 11px;
    color: #a0a0a0;
    max-width: 640px;
    margin: 10px auto 0;
    line-height: 1.5;
  }
  nav.categories {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 12px 20px 0;
  }
  nav.categories button {
    border: 1px solid var(--border);
    background: #fff;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    color: var(--black);
    transition: background .15s, color .15s;
  }
  nav.categories button.active,
  nav.categories button:hover {
    background: var(--black);
    color: #fff;
    border-color: var(--black);
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 24px 80px;
  }
  .category-block {
    margin-bottom: 40px;
  }
  .category-block h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--grey-text);
    margin: 0 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover {
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }
  .card-image {
    height: 200px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    position: relative;
  }
  .card-image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .card-image .placeholder {
    font-size: 40px;
  }
  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #eafaf0;
    color: #1a8a4a;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .badge.out {
    background: #fdecec;
    color: #c0392b;
  }
  .card-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .card-body h3 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
  }
  .card-body p.desc {
    font-size: 12.5px;
    color: var(--grey-text);
    margin: 0 0 8px;
    min-height: 32px;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
  }
  .price {
    font-size: 16px;
    font-weight: 700;
  }
  .order-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--black);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    flex-shrink: 0;
    transition: background .15s;
  }
  .order-btn:hover {
    background: #333;
  }
  footer {
    text-align: center;
    padding: 30px 20px 50px;
    font-size: 12px;
    color: var(--grey-text);
  }
</style>
</head>
<body>

<header>
  <h1>KTA LABS</h1>
  <p>Catalogue produits — usage recherche uniquement</p>
  <div class="disclaimer">Tous les produits proposés sont destinés exclusivement à un usage de recherche en laboratoire. Non destinés à la consommation humaine ou animale.</div>
</header>

<nav class="categories" id="categoryNav"></nav>

<main id="catalogue"></main>

<footer>KTA Labs — mis à jour automatiquement</footer>

<script>
const TALLY_URL = "https://tally.so/r/0QyAD9";

async function loadCatalogue() {
  const res = await fetch('products.json');
  const products = await res.json();

  const categories = [...new Set(products.map(p => p.categorie))];
  const nav = document.getElementById('categoryNav');
  const main = document.getElementById('catalogue');

  const allBtn = document.createElement('button');
  allBtn.textContent = "Tout";
  allBtn.className = "active";
  allBtn.onclick = () => filterCategory(null, allBtn);
  nav.appendChild(allBtn);

  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat;
    btn.onclick = () => filterCategory(cat, btn);
    nav.appendChild(btn);
  });

  categories.forEach(cat => {
    const block = document.createElement('div');
    block.className = 'category-block';
    block.dataset.category = cat;

    const title = document.createElement('h2');
    title.textContent = cat;
    block.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';

    products.filter(p => p.categorie === cat).forEach(p => {
      grid.appendChild(renderCard(p));
    });

    block.appendChild(grid);
    main.appendChild(block);
  });
}

function renderCard(p) {
  const card = document.createElement('div');
  card.className = 'card';

  const inStock = p.stock !== null ? p.stock > 0 : (p.disponibilite !== "Rupture de stock");
  const stockLabel = p.stock !== null ? `${p.stock} en stock` : (p.disponibilite || "En stock");

  card.innerHTML = `
    <div class="card-image">
      <span class="badge ${inStock ? '' : 'out'}">${inStock ? stockLabel : 'Rupture'}</span>
      ${p.image ? `<img src="${p.image}" alt="${p.nom}">` : `<span class="placeholder">💉</span>`}
    </div>
    <div class="card-body">
      <h3>${p.nom}</h3>
      <p class="desc">${p.description}</p>
      <div class="card-footer">
        <span class="price">${p.prix.toFixed(2).replace('.', ',')} €</span>
        <a class="order-btn" href="${TALLY_URL}" target="_blank" rel="noopener" aria-label="Commander">↗</a>
      </div>
    </div>
  `;
  return card;
}

function filterCategory(cat, btn) {
  document.querySelectorAll('nav.categories button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.category-block').forEach(block => {
    block.style.display = (!cat || block.dataset.category === cat) ? '' : 'none';
  });
}

loadCatalogue();
</script>

</body>
</html>
