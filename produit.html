<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTA Labs — Fiche produit</title>
<link rel="icon" href="images/logo.png">
<meta name="description" content="Fiche technique complète pour les peptides de recherche KTA Labs : reconstitution, dose, effets et précautions d'usage.">
<style>
  :root {
    --black: #16204a;
    --navy-deep: #0e1730;
    --blue-accent: #4d6fb8;
    --grey-text: #6b7280;
    --border: #e8eaf1;
    --bg: #f8f9fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--black);
  }
  .top-accent {
    height: 4px;
    width: 100%;
    background: linear-gradient(90deg, var(--navy-deep), var(--blue-accent) 55%, #a9c1e8);
  }
  .top-bar {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top-bar img.mini-logo {
    height: 28px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--grey-text);
    text-decoration: none;
    font-size: 13px;
  }
  .back-link:hover { color: var(--black); }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 24px 80px;
  }
  .hero {
    display: flex;
    gap: 24px;
    align-items: center;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 28px;
  }
  .hero img {
    width: 110px;
    height: 110px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .hero h1 {
    font-size: 24px;
    margin: 0 0 4px;
    letter-spacing: 1px;
  }
  .hero p {
    margin: 0;
    color: var(--grey-text);
    font-size: 13px;
  }
  .warning {
    background: #fff8e6;
    border: 1px solid #f5deac;
    color: #8a6100;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    margin-bottom: 24px;
  }
  section.block {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  section.block h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--grey-text);
    margin: 0 0 10px;
  }
  section.block ul {
    margin: 0;
    padding-left: 18px;
    font-size: 14px;
    line-height: 1.7;
  }
  section.block p {
    margin: 0;
    font-size: 14px;
    line-height: 1.7;
  }
  .note {
    font-size: 12.5px;
    color: var(--grey-text);
    font-style: italic;
    margin-top: 10px;
  }
  .dose-calc-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 700;
    padding: 11px 18px;
    border-radius: 999px;
    background: var(--blue-accent);
    border: 1.5px solid var(--blue-accent);
    color: #fff;
    margin-top: 14px;
  }
  .dose-calc-btn:hover { background: var(--black); border-color: var(--black); }
  .dose-calc-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .disclaimer {
    text-align: center;
    font-size: 11px;
    color: #a0a0a0;
    max-width: 640px;
    margin: 30px auto 0;
    line-height: 1.5;
  }
  #loading, #notfound {
    text-align: center;
    color: var(--grey-text);
    padding: 60px 20px;
  }
</style>
</head>
<body>

<div class="top-accent"></div>

<div class="top-bar">
  <a class="back-link" href="catalogue.html">← Retour au catalogue</a>
  <img class="mini-logo" src="images/logo.png" alt="KTA Labs">
</div>

<main>
  <div id="loading">Chargement…</div>
  <div id="notfound" style="display:none">Fiche introuvable.</div>
  <div id="content" style="display:none"></div>
</main>

<div class="disclaimer">Informations fournies à titre indicatif pour un usage de recherche uniquement. Non destiné à la consommation humaine ou animale.</div>
<div style="text-align:center;margin:10px 0 20px;font-size:12px">
  <a href="mentions-legales.html" style="color:var(--grey-text);text-decoration:none;margin:0 8px">Mentions légales</a>·
  <a href="cgv.html" style="color:var(--grey-text);text-decoration:none;margin:0 8px">CGV</a>·
  <a href="confidentialite.html" style="color:var(--grey-text);text-decoration:none;margin:0 8px">Confidentialité</a>
</div>

<script>
function section(title, bodyHtml) {
  return `<section class="block"><h2>${title}</h2>${bodyHtml}</section>`;
}
function list(items) {
  return `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const imgOverride = params.get('img');
  const res = await fetch('fiches.json');
  const fiches = await res.json();
  const f = fiches[id];
  if (f && imgOverride) f.image = imgOverride;

  document.getElementById('loading').style.display = 'none';

  if (!f) {
    document.getElementById('notfound').style.display = 'block';
    return;
  }

  const SITE_BASE_URL = 'https://kta-labs.github.io/ktalabs.com/';
  const pageUrl = `${SITE_BASE_URL}produit.html?id=${encodeURIComponent(id)}`;
  const imageUrl = f.image ? (f.image.startsWith('http') ? f.image : `${SITE_BASE_URL}${f.image}`) : `${SITE_BASE_URL}images/logo.png`;
  const plainDesc = (f.a_savoir || (f.effets && f.effets.length ? `Recherché notamment pour : ${f.effets.slice(0, 3).join(', ').toLowerCase()}.` : `Fiche technique complète pour ${f.nom} : reconstitution, dose, effets et précautions d'usage.`)).slice(0, 300);
  const title = `${f.nom} — Fiche technique — KTA Labs`;

  document.title = title;
  function setMetaTag(attr, key, content) {
    let el = document.querySelector(`meta[${attr}="${key}"]`);
    if (!el) {
      el = document.createElement('meta');
      el.setAttribute(attr, key);
      document.head.appendChild(el);
    }
    el.setAttribute('content', content);
  }
  let canonicalEl = document.querySelector('link[rel="canonical"]');
  if (!canonicalEl) {
    canonicalEl = document.createElement('link');
    canonicalEl.setAttribute('rel', 'canonical');
    document.head.appendChild(canonicalEl);
  }
  canonicalEl.setAttribute('href', pageUrl);
  setMetaTag('name', 'description', plainDesc);
  setMetaTag('property', 'og:type', 'article');
  setMetaTag('property', 'og:url', pageUrl);
  setMetaTag('property', 'og:title', title);
  setMetaTag('property', 'og:description', plainDesc);
  setMetaTag('property', 'og:image', imageUrl);
  setMetaTag('name', 'twitter:card', 'summary_large_image');
  setMetaTag('name', 'twitter:title', title);
  setMetaTag('name', 'twitter:description', plainDesc);
  setMetaTag('name', 'twitter:image', imageUrl);

  let html = `
    <div class="hero">
      <img src="${f.image}" alt="${f.nom}">
      <div>
        <h1>${f.nom}</h1>
        <p>Fiche d'information — usage recherche</p>
      </div>
    </div>
  `;

  if (f.attention) {
    html += `<div class="warning">⚠️ ${f.attention}</div>`;
  }

  if (f.reconstitution) {
    let reconstHtml = list(f.reconstitution);
    reconstHtml += `<a class="dose-calc-btn" href="ressources.html#tuto-reconstitution"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>Voir le tuto reconstitution</a>`;
    html += section('Reconstitution', reconstHtml);
  }

  if (f.dose) {
    let doseHtml = list(f.dose);
    if (f.dose_note) doseHtml += `<p class="note">${f.dose_note}</p>`;
    doseHtml += `<a class="dose-calc-btn" href="ressources.html#calculateur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="11" x2="8" y2="11"></line><line x1="12" y1="11" x2="12" y2="11"></line><line x1="16" y1="11" x2="16" y2="11"></line><line x1="8" y1="15" x2="8" y2="15"></line><line x1="12" y1="15" x2="12" y2="15"></line><line x1="16" y1="15" x2="16" y2="15"></line><line x1="8" y1="19" x2="8" y2="19"></line><line x1="12" y1="19" x2="12" y2="19"></line><line x1="16" y1="19" x2="16" y2="19"></line></svg>Calculer ma dose</a>`;
    html += section('Dose', doseHtml);
  }

  if (f.quand) {
    html += section('Quand le prendre', list(f.quand));
  }

  if (f.premiers_effets) {
    html += section('Au bout de combien de temps arrivent les premiers effets ?', `<p>${f.premiers_effets}</p>`);
  }

  if (f.combien_de_temps) {
    html += section('Combien de temps en prendre ?', `<p>${f.combien_de_temps}</p>`);
  }

  if (f.effets) {
    html += section('Effets', list(f.effets));
  }

  if (f.effets_secondaires) {
    let sideHtml = list(f.effets_secondaires);
    if (f.note_bas) sideHtml += `<p class="note">${f.note_bas}</p>`;
    html += section('Effets secondaires possibles', sideHtml);
  }

  if (f.a_savoir) {
    html += section('À savoir', `<p>${f.a_savoir}</p>`);
  }

  const contentEl = document.getElementById('content');
  contentEl.innerHTML = html;
  contentEl.style.display = 'block';
}

load();
</script>
<script src="chatbot.js"></script>
</body>
</html>
